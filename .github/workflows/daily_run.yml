name: Daily Pipeline Run

on:
  # Primary trigger: Vercel Cron (dashboard/app/api/cron/daily-run) dispatches this
  # every weekday with start_at_et=10:30 — 1 hour after the US open, same New York
  # time year-round. GitHub's own schedule was starting runs 5-9 hours late.
  #
  # This schedule is only a BACKUP in case Vercel's trigger fails: the guard step
  # below makes it skip itself whenever a run already exists for today.
  schedule:
    - cron: '0 16 * * 1-5'
  workflow_dispatch:
    # Manual trigger for testing
    inputs:
      start_at_et:
        description: 'Wait until this New York time (HH:MM) before running — blank = start now'
        required: false
        default: ''
      skip_phase_a:
        description: 'Skip Phase A (portfolio review)?'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']
      phase_a_mode:
        description: 'Phase A mode (Standard=daily sentiment refresh; Full=full re-analysis every day; Auto=Standard + Fundamental near earnings)'
        required: false
        default: 'Standard'
        type: choice
        options: ['Auto', 'Lite', 'Standard', 'Full']

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 300  # up to ~2.5h waiting for 10:30 New York + the pipeline itself
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Skip if today already has a run (backup schedule only)
        id: guard
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Start of today in New York, as a UTC ISO timestamp (string-comparable to created_at)
          SINCE=$(TZ=America/New_York date -d "today 00:00" -u +%Y-%m-%dT%H:%M:%SZ)
          TODAY=$(TZ=America/New_York date +%F)
          COUNT=$(gh api "repos/${{ github.repository }}/actions/workflows/daily_run.yml/runs?per_page=10" \
            --jq "[.workflow_runs[] | select(.id != ${{ github.run_id }})
                   | select(.conclusion != \"cancelled\" and .conclusion != \"skipped\")
                   | select(.created_at >= \"$SINCE\")] | length" 2>/dev/null || echo 0)
          if [ "${COUNT:-0}" -gt 0 ]; then
            echo "A run already exists for $TODAY — backup schedule skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Wait until start time (New York)
        if: github.event.inputs.start_at_et != ''
        run: |
          TARGET=$(TZ=America/New_York date -d "today ${{ github.event.inputs.start_at_et }}" +%s)
          NOW=$(date +%s)
          WAIT=$((TARGET - NOW))
          if [ "$WAIT" -gt 0 ]; then
            echo "Waiting $((WAIT / 60)) min until ${{ github.event.inputs.start_at_et }} New York time"
            sleep "$WAIT"
          else
            echo "Already past ${{ github.event.inputs.start_at_et }} New York time — starting now"
          fi

      - name: Checkout repo
        if: steps.guard.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          # Need write access to commit results back
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        if: steps.guard.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        if: steps.guard.outputs.skip != 'true'
        run: pip install -r requirements.txt

      - name: Run daily pipeline
        if: steps.guard.outputs.skip != 'true'
        env:
          # Alpaca (paper trading)
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          ALPACA_BASE_URL: ${{ secrets.ALPACA_BASE_URL }}
          # Market data
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          # LLM — both keys always present; LLM_PROVIDER (repo variable) picks
          # which one is used. Switch with: gh variable set LLM_PROVIDER --body openai|anthropic
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}
          # Pipeline config
          PHASE_A_MODE: ${{ github.event.inputs.phase_a_mode || '' }}
          SKIP_PHASE_A: ${{ github.event.inputs.skip_phase_a || 'false' }}
          ALLOW_LIVE_TRADING: 'true'
        run: python main.py

      - name: Sync reports to dashboard
        if: success() && steps.guard.outputs.skip != 'true'
        run: python scripts/sync_reports.py

      - name: Upload pipeline report
        if: always() && steps.guard.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-report-${{ github.run_id }}
          path: |
            data/reports/pipeline_result.json
            logs/
          retention-days: 30
          if-no-files-found: warn

      - name: Commit data back to repo
        if: success() && steps.guard.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Rebase onto remote main to pick up any pushes made during the pipeline run.
          # --autostash handles modified tracked files (positions_log, decision_log, etc.).
          # New untracked files (daily_report_*.json) are untouched by rebase and remain
          # in the working tree — do NOT use git stash --include-untracked as a failed
          # stash pop silently swallows new files and nothing gets committed.
          git fetch origin main
          git rebase --autostash origin/main
          # Stage all pipeline output files (tracked modifications + new untracked files).
          # Use || true for individual file paths — they abort with set -e if missing.
          # Directory paths (reports/, memory/) never fail even if nothing changed.
          git add data/memory/positions_log.json   || true
          git add data/memory/decision_log.json    || true
          git add data/memory/pattern_history.json || true
          git add dashboard/data/reports/
          git add dashboard/data/memory/
          # Pipeline-auto deep-dive reports (generated for every debated/entered
          # candidate) — previously never committed, so they were generated every
          # run and immediately discarded; dashboard never saw them.
          git add data/adhoc_reports/
          git add dashboard/data/adhoc_reports/
          # Only commit and push if there are staged changes.
          # Retry push up to 3 times in case another workflow pushed between our rebase and push.
          if git diff --cached --quiet; then
            echo "No data changes to commit"
          else
            git commit -m "chore: daily pipeline data update $(date -u '+%Y-%m-%d')"
            for i in 1 2 3; do
              git push origin HEAD:main && break
              echo "Push attempt $i failed — rebasing and retrying..."
              git fetch origin main && git rebase --autostash origin/main
            done
          fi

      # Dashboard deploy is handled by deploy.yml, triggered automatically
      # when the "Commit data back to repo" step pushes dashboard/data/** changes.
      # Keeping deploy out of this workflow ensures a broken dashboard build
      # never causes a false-failure of the trading pipeline.

